installer_slug: rabbids-go-home-DVD
name: Rabbids Go home
notes: "For detailled instructuctions on required installer, See the following Github: https://github.com/DYCAMAX/rabbids-go-home-lutris"
runner: wine

script:
  game:
  exe: $GAMEDIR/drive_c/Program Files (x86)/Ubisoft/Rabbids Go Home - DVD/Launcher.exe
  prefix: $GAMEDIR
installer:
- task:
    arch: win64
    description: Creating WINE prefix...
    name: create_prefix
    prefix: $GAMEDIR
- task:
    app: fontsmooth=rgb
    description: Installing winetricks dependencies...
    name: winetricks
    prefix: $GAMEDIR
- insert-disc:
    description: Waiting for game installer...
    message: Insert disc
    requires: setup.exe
- task:
    description: Installing Rabbids Go Home...
    executable: $DISC/setup.exe
    name: wineexec
    prefix: $GAMEDIR

slug: rabbids-go-home-DVD
steamid: null
version: Windows Version (DVD)
year: 2010
